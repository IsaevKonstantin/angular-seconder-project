<tui-textfield [tuiTextfieldSize]="size" [tuiTextfieldCleaner]="isCleaner">
    <label tuiLabel>{{ label }}</label>
    <input
        tuiTextfield
        type="password"
        [placeholder]="placeholder"
        [formControl]="inputPassControl"
        name="password"
    />
    <tui-icon tuiPassword />
</tui-textfield>
