<section class="container">
      <div class="header">
            <img src="/assets/icons/seconder-icon.svg">
            <h1>{{ "TITLE" | translate }}</h1>
      </div>

      <section class="register">
            <h2>{{ "REGISTER.HEADER" | translate }}</h2>
            <ui-input
                  class="width"
                  [isCleaner]="true"
                  size="m"
                  [label]="'REGISTER.LOG_INPUT' | translate"
                  [placeholder]="'REGISTER.LOG_INPUT_PLACHOLDER' | translate"
                  type="username"
                  [inputControl]="form.controls.login"
            />
            <ui-input-password
                  class="width"
                  [isCleaner]="true"
                  size="m"
                  [label]="'REGISTER.PASS_INPUT' | translate"
                  [placeholder]="'REGISTER.PASS_INPUT_PLACHOLDER' | translate"
                  [inputPassControl]="form.controls.password"
            />
            <ui-input
                  class="width"
                  [isCleaner]="true"
                  size="m"
                  [label]="'REGISTER.LAST_NAME_INPUT' | translate"
                  [placeholder]="'REGISTER.LAST_NAME_INPUT_PLACHOLDER' | translate"
                  [inputControl]="form.controls.lastName"
            />
            <ui-input
                  class="width"
                  [isCleaner]="true"
                  size="m"
                  [label]="'REGISTER.FIRST_NAME_INPUT' | translate"
                  [placeholder]="'REGISTER.FIRST_NAME_INPUT_PLACHOLDER' | translate"
                  [inputControl]="form.controls.firstName"
            />
            <ui-input
                  class="width"
                  [isCleaner]="true"
                  size="m"
                  [label]="'REGISTER.PATRONYMIC_INPUT' | translate"
                  [placeholder]="'REGISTER.PATRONYMIC_INPUT_PLACHOLDER' | translate"
                  [inputControl]="form.controls.patronymic"
            />
            <ui-input-phone 
                  class="width"
                  [isCleaner]="true"
                  size="m"
                  [label]="'REGISTER.PHONE_INPUT' | translate"
                  [placeholder]="'REGISTER.PHONE_INPUT_PLACHOLDER' | translate"
                  [inputControl]="form.controls.phone"
            />
            <ui-input
                  class="width"
                  [isCleaner]="true"
                  size="m"
                  [label]="'REGISTER.EMAIL_INPUT' | translate"
                  [placeholder]="'REGISTER.EMAIL_INPUT_PLACHOLDER' | translate"
                  type="email"
                  autocomplete="on"
                  [inputControl]="form.controls.email"
            />
            <ui-button
                  class="width"
                  appearance="primary" 
                  size="m" 
                  [isDisabled]="form.invalid"
                  (click)="register()"
            >
                  {{ 'REGISTER.REG_BUT' | translate }}
            </ui-button>
            <ui-button
                  class="width"
                  appearance="outline"
                  size="m" 
                  (click)="goSignIn()"
            >
                  {{ 'REGISTER.SIGN_BUT' | translate }}
            </ui-button>
            <ui-language-group />
      </section>
</section>
